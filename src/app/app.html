
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">M</span>
      <div>
        <strong>MargeWeb</strong>
        <small>CRM</small>
      </div>
    </div>

    <nav class="navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        ◫ Tableau de bord
      </a>

      <a
        routerLink="/prospects"
        routerLinkActive="active">
        ♙ Prospects
      </a>

      <a routerLink="/pipeline" routerLinkActive="active">
      ▤ Pipeline
      </a>
      <a routerLink="/follow-ups" routerLinkActive="active">
        <span>◷ Relances</span>

        @if (urgentFollowUpCount() > 0) {
          <span class="notification-count">
            {{ urgentFollowUpCount() }}
          </span>
        }
      </a>
      <a routerLink="/messaging" routerLinkActive="active">
        Messagerie

        @if (unreadEmailCount() > 0) {
          <span class="notification-count">
            {{ unreadEmailCount() }}
          </span>
        }
      </a>
      <a class="disabled">♧ Clients</a>
      <a class="disabled">▣ Abonnements</a>
    </nav>

    <div class="sidebar-footer">
      MargeWeb CRM · v1.0
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
