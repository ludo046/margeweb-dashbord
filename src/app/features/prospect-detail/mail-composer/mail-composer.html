
<div class="mail-overlay">

  <section
    class="mail-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Rédaction d'un e-mail">

    <header class="mail-header">

      <h2>{{ title() }}</h2>

      <button
        type="button"
        class="close-btn"
        aria-label="Fermer"
        [disabled]="sending()"
        (click)="close()">
        ×
      </button>

    </header>

    <form
      #mailForm="ngForm"
      (ngSubmit)="mailForm.valid && send()">

      <div class="mail-fields">

        <div class="mail-field">

          <label>De</label>

          <input
            type="text"
            value="MargeWeb <contact@margeweb.fr>"
            readonly>

        </div>

        <div class="mail-field">

          <label for="recipient">À</label>

          <input
            id="recipient"
            type="email"
            name="recipient"
            [(ngModel)]="recipient"
            [readonly]="recipientLocked()"
            [disabled]="sending()"
            placeholder="contact@exemple.fr"
            required
            email>

        </div>

        <div class="mail-field">

          <label for="subject">Objet</label>

          <input
            id="subject"
            type="text"
            name="subject"
            [(ngModel)]="subject"
            [disabled]="sending()"
            placeholder="Objet du message"
            maxlength="255"
            required>

        </div>

        <div class="mail-field">

          <label for="content">Message</label>

          <textarea
            id="content"
            name="content"
            [(ngModel)]="content"
            [disabled]="sending()"
            placeholder="Rédigez votre message..."
            rows="14"
            required>
          </textarea>

        </div>

        @if (error()) {

          <div class="mail-error" role="alert">
            {{ error() }}
          </div>

        }

      </div>

      <footer class="mail-footer">

        <button
          type="button"
          class="secondary-btn"
          [disabled]="sending()"
          (click)="close()">
          Annuler
        </button>

        <button
          type="submit"
          class="primary-btn"
          [disabled]="
            mailForm.invalid ||
            sending() ||
            !subject.trim() ||
            !content.trim()
          ">

          {{ sending() ? 'Envoi en cours...' : '✉ Envoyer' }}

        </button>

      </footer>

    </form>

  </section>

</div>
