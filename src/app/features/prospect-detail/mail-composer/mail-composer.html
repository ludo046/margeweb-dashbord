
<div class="mail-overlay">

  <section
    class="mail-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Rédaction d'un e-mail">

    <header class="mail-header">

      <h2>{{ title() }}</h2>

      <button
        type="button"
        class="close-btn"
        aria-label="Fermer"
        [disabled]="busy()"
        (click)="close()">
        ×
      </button>

    </header>

    <form
      #mailForm="ngForm"
      (ngSubmit)="mailForm.valid && send()">

      <div class="mail-fields">

        <div class="mail-field">

          <label for="sender">De</label>

          <input
            id="sender"
            type="text"
            value="MargeWeb <contact@margeweb.fr>"
            readonly>

        </div>

        <div class="mail-field">

          <label for="recipient">À</label>

          <input
            id="recipient"
            type="email"
            name="recipient"
            [ngModel]="recipient"
            (ngModelChange)="recipient = $event; onFieldChange()"
            [readonly]="recipientLocked()"
            [disabled]="busy()"
            placeholder="contact@exemple.fr"
            required
            email>

        </div>

        <div class="mail-field">

          <label for="subject">Objet</label>

          <input
            id="subject"
            type="text"
            name="subject"
            [ngModel]="subject"
            (ngModelChange)="subject = $event; onFieldChange()"
            [disabled]="busy()"
            placeholder="Objet du message"
            maxlength="255"
            required>

        </div>

        <div class="mail-field">

          <label for="content">Message</label>

          <textarea
            id="content"
            name="content"
            [ngModel]="content"
            (ngModelChange)="content = $event; onFieldChange()"
            [disabled]="busy()"
            placeholder="Rédigez votre message..."
            rows="14"
            required>
          </textarea>

        </div>

        @if (error()) {

          <div class="mail-error" role="alert">

            {{ error() }}

          </div>

        }

        <div
          class="save-status"
          [class.saved]="saveState() === 'saved'"
          [class.pending]="saveState() === 'pending'"
          [class.saving]="saveState() === 'saving'"
          [class.failed]="saveState() === 'error'"
          role="status"
          aria-live="polite">

          @switch (saveState()) {

            @case ('saving') {

              <span class="save-spinner"></span>

            }

            @case ('saved') {

              <span class="save-icon">✓</span>

            }

            @case ('error') {

              <span class="save-icon">!</span>

            }

            @default {

              <span class="save-dot"></span>

            }

          }

          <span>{{ saveLabel() }}</span>

          @if (saveState() === 'error') {

            <button
              type="button"
              class="retry-btn"
              [disabled]="busy()"
              (click)="saveDraft()">

              Réessayer

            </button>

          }

        </div>

      </div>

      <footer class="mail-footer">

        <button
          type="button"
          class="delete-btn"
          [disabled]="busy()"
          (click)="discard()">

          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M3 6h18"/>
            <path d="M8 6V4h8v2"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 10v6"/>
            <path d="M14 10v6"/>

          </svg>

          {{ deleting() ? 'Suppression...' : 'Supprimer' }}

        </button>

        <div class="footer-actions">

          <button
            type="button"
            class="secondary-btn"
            [disabled]="busy()"
            (click)="close()">

            {{ closing() ? 'Sauvegarde...' : 'Fermer' }}

          </button>

          <button
            type="submit"
            class="primary-btn"
            [disabled]="
              mailForm.invalid ||
              busy() ||
              !recipient.trim() ||
              !subject.trim() ||
              !content.trim()
            ">

            {{ sending() ? 'Envoi en cours...' : '✉ Envoyer' }}

          </button>

        </div>

      </footer>

    </form>

  </section>

</div>
